# Servidor automático de horarios de Mario-Bus. Funciona en los servidores de GitHub: NO necesita el ordenador de Mario.
#
#  * Una vez al día mira un resumen de 1 KB de la fuente oficial del Consorcio. Si no cambió: no descarga, no convierte, no publica.
#  * Si cambió: descarga el GTFS, lo valida a fondo, lo compara con la última versión buena, genera los 4 JSON, firma el manifiesto
#    y publica en GitHub Pages SOLO si todo es correcto y COMPLETO. Si algo falla o falta servicio que había antes: no publica
#    nada y se conserva la última versión (en GitHub Pages sigue lo que había).
#  * Ejecuciones a mano (Actions → «Horarios Mario-Bus» → Run workflow): ciclo forzado, actualización de PRUEBA controlada
#    (marcada como prueba; solo la acepta la variante de prueba de la app) o restaurar una versión anterior.
#  * La clave privada de firma está en Settings → Secrets → HORARIOS_FIRMA_PRIVADA. Nunca se escribe en el repositorio.
name: Horarios Mario-Bus

on:
  schedule:
    # GitHub retrasa o se salta los cron (medido: el de las 04:17 UTC corrió a las 13:07 UTC). Por eso hay varios disparadores a lo
    # largo del día: cada uno que llegue comprueba, y si ya se comprobó hace <20 h termina en «OMITIDO» sin descargar ni publicar nada
    # (regla: como máximo UNA comprobación real de la fuente oficial cada 20 h, pase lo que pase con los disparadores).
    - cron: "11 1 * * *"
    - cron: "17 4 * * *"          # principal (04:17 UTC = 05:17 en Madrid en invierno)
    - cron: "43 8 * * *"
    - cron: "47 15 * * *"
    - cron: "29 21 * * *"
  push:                            # disparo desde git (sin pulsar botones): cambiar disparar/accion.txt y subirlo
    paths: ["disparar/**"]
  workflow_dispatch:                 # lo usa cron-job.org (respaldo): SOLO puede hacer el ciclo normal; no admite «acción» ni «versión»
    inputs:
      origen:
        description: "Quién lo dispara (se anota en el registro): manual, respaldo-externo…"
        required: false
        default: manual
        type: string

concurrency:
  group: horarios
  cancel-in-progress: false

permissions:
  contents: write                  # guardar el estado (estado/) en este mismo repositorio
  pages: write
  id-token: write

env:
  MARIOBUS_ESTRICTO: "1"           # un feed incompleto se RECHAZA, nunca queda «pendiente» ni se publica
  MARIOBUS_SIN_PARCIALES: "1"      # no existe la aprobación manual de parciales
  MARIOBUS_CLAVES: ${{ github.workspace }}/claves
  PYTHONUTF8: "1"

jobs:
  horarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # historia completa: hace falta para comprobar que este commit sigue siendo antepasado de main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # P1 · VIGENCIA. Va ANTES de la clave, de las pruebas y de todo lo demás: si esta ejecución es una reejecución (usaría el commit, el
      # código y el estado de cuando se creó) o su commit ya no es válido respecto a main, el trabajo se PARA AQUÍ: no se usa el secreto,
      # no se descarga, no se escribe ni se publica nada (todos los pasos siguientes se saltan). Si main solo avanzó por commits de
      # estado del propio servidor (los de una ejecución anterior en cola), la ejecución se pone al día y sigue.
      - name: Vigencia de la ejecución (respecto a main)
        env:
          EVENTO: ${{ github.event_name }}
          REFERENCIA: ${{ github.ref }}
          INTENTO: ${{ github.run_attempt }}
        run: python tools/guardias_ejecucion.py vigencia --repo=. --evento="$EVENTO" --ref="$REFERENCIA" --intento="$INTENTO"

      - run: pip install -r requirements.txt

      # Si las pruebas fallan no se publica NADA (el job se para aquí)
      - name: Pruebas del servidor
        run: python tools/tests/test_actualizar_horarios.py

      - name: Clave de firma (desde el secreto)
        env:
          CLAVE: ${{ secrets.HORARIOS_FIRMA_PRIVADA }}
          CLAVE_PRUEBA: ${{ secrets.HORARIOS_FIRMA_PRUEBA }}
        run: |
          test -n "$CLAVE" || { echo "::error::Falta el secreto HORARIOS_FIRMA_PRIVADA"; exit 1; }
          mkdir -p claves
          printf '%s\n' "$CLAVE" > claves/horarios-firma-privada.pem
          chmod 600 claves/horarios-firma-privada.pem
          # 1.84: clave de PRUEBA, distinta de la de producción. Solo firma lo que va a /prueba/. Si falta, solo falla la acción prueba_controlada.
          if [ -n "$CLAVE_PRUEBA" ]; then
            mkdir -p claves_prueba
            printf '%s\n' "$CLAVE_PRUEBA" > claves_prueba/horarios-firma-privada.pem
            chmod 600 claves_prueba/horarios-firma-privada.pem
          fi

      - name: Hacer lo pedido
        id: trabajo
        continue-on-error: true      # aunque falle hay que guardar el estado; al final se marca el fallo
        env:
          EVENTO: ${{ github.event_name }}
          ORIGEN_ENTRADA: ${{ github.event.inputs.origen }}
        shell: bash
        run: |
          set -o pipefail
          ACCION=ciclo
          VERSION=""
          # Las acciones EXTRAORDINARIAS (forzar, prueba, restaurar) se leen SOLO de disparar/accion.txt y SOLO cuando el evento es un
          # «push» (hace falta poder escribir en el repositorio; el token de cron-job.org no puede). Un cron o una llamada a la API
          # (cron-job.org) hacen siempre y únicamente el ciclo normal. Python lo vuelve a comprobar con estas dos variables.
          if [ "$EVENTO" = "push" ] && [ -f disparar/accion.txt ]; then
            ACCION=$(head -n1 disparar/accion.txt | tr -d ' \r\n')
            VERSION=$(sed -n 2p disparar/accion.txt | tr -d ' \r\n')
          fi
          export MARIOBUS_EVENTO="$EVENTO"
          export MARIOBUS_ORIGEN="${ORIGEN_ENTRADA:-$EVENTO}"
          ACCION="${ACCION:-ciclo}"
          echo "$ACCION" > accion_elegida.txt
          case "$ACCION" in
            ciclo)             python tools/actualizar_horarios.py --salida estado 2>&1 | tee salida_trabajo.txt ;;
            ciclo_forzado)     python tools/actualizar_horarios.py --salida estado --forzar 2>&1 | tee salida_trabajo.txt ;;
            prueba_controlada) test -f claves_prueba/horarios-firma-privada.pem || { echo "::error::Falta el secreto HORARIOS_FIRMA_PRUEBA: la prueba se firma con la clave de PRUEBA, nunca con la de producción"; exit 1; }
                               python tools/actualizar_horarios.py --salida estado --prueba-controlada prueba_controlada --claves claves_prueba --motivo "prueba del recorrido servidor-móvil" 2>&1 | tee salida_trabajo.txt ;;
            restaurar)         python tools/actualizar_horarios.py --salida estado --restaurar "$VERSION" 2>&1 | tee salida_trabajo.txt ;;
            *)                 echo "acción desconocida"; exit 1 ;;
          esac

      # Registro público de cuándo se ejecutó y por qué (schedule = automático; workflow_dispatch = a mano)
      # P2 · La línea se construye en Python con TODOS los campos limpios (sin saltos de línea ni caracteres de control o de formato, sin
      # «|», recortados): quien llame a la API no puede falsificar entradas del registro con el texto de «origen».
      - name: Registrar la ejecución
        if: always() && steps.trabajo.outcome != 'skipped'
        env:
          EVENTO: ${{ github.event_name }}
          RESULTADO_PASO: ${{ steps.trabajo.outcome }}
          RUN: ${{ github.run_number }}
          PROGRAMADO: ${{ github.event.schedule }}
          ORIGEN: ${{ github.event.inputs.origen }}
        run: |
          ACCION=$(cat accion_elegida.txt 2>/dev/null || echo ciclo)
          RES=$(grep -m1 -E "RESULTADO|OMITIDO|SIN_CAMBIOS|SIN_RED|PRUEBA|Restaurada|Publicada" salida_trabajo.txt 2>/dev/null | cut -c1-220 || true)
          python tools/guardias_ejecucion.py registro --run="$RUN" --evento="$EVENTO" --origen="$ORIGEN" --cron="$PROGRAMADO" \
            --accion="$ACCION" --paso="$RESULTADO_PASO" --resultado="${RES:-sin resultado}" >> estado/ejecuciones.log
          tail -n 300 estado/ejecuciones.log > estado/ejecuciones.tmp && mv estado/ejecuciones.tmp estado/ejecuciones.log
          rm -f salida_trabajo.txt

      - name: Borrar la clave del disco
        if: always()
        run: rm -rf claves claves_prueba

      # P3 · DESARMADO. Tras una acción extraordinaria lanzada por un push (forzar, prueba, restaurar), disparar/accion.txt vuelve a `ciclo`
      # en el mismo commit de estado (con el GITHUB_TOKEN, que no dispara otra ejecución). Se desarma también si la acción FALLÓ (no se
      # publicó nada): una instrucción fallida que siguiera armada se repetiría sola en cualquier push posterior. Queda anotado en el registro.
      - name: Desarmar la instrucción extraordinaria
        if: always() && steps.trabajo.outcome != 'skipped'
        env:
          EVENTO: ${{ github.event_name }}
          RESULTADO_PASO: ${{ steps.trabajo.outcome }}
          RUN: ${{ github.run_number }}
        run: |
          ACCION=$(cat accion_elegida.txt 2>/dev/null || echo ciclo)
          NOTA=$(python tools/guardias_ejecucion.py desarmar --ruta=disparar/accion.txt --accion="$ACCION" --evento="$EVENTO" --paso="$RESULTADO_PASO")
          if [ -n "$NOTA" ]; then
            python tools/guardias_ejecucion.py registro --run="$RUN" --evento="$EVENTO" --origen="desarmado" --cron="" \
              --accion="$ACCION" --paso="$RESULTADO_PASO" --resultado="$NOTA" >> estado/ejecuciones.log
          fi
          rm -f accion_elegida.txt

      - name: Latido y estado
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > estado/ultimo_latido.txt   # también evita que GitHub desactive el programador por inactividad

      - name: ¿Cambió lo publicable?
        id: cambio
        run: |
          git add -A estado disparar/accion.txt      # accion.txt solo cambia si se desarmó una instrucción extraordinaria
          if git diff --cached --quiet -- estado/publicable; then echo "cambio=no" >> "$GITHUB_OUTPUT"; else echo "cambio=si" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar el estado en el repositorio
        run: |
          git config user.name "servidor-horarios"
          git config user.email "servidor-horarios@users.noreply.github.com"
          git commit -m "estado $(date -u +%F) ($(cat estado/ultimo_latido.txt))" || echo "sin cambios que guardar"
          # Si main se movió mientras trabajábamos (p. ej. alguien subió un cambio), se reintenta UNA vez sobre la versión actual: los
          # archivos de estado no chocan con los de código. Si aun así falla, el trabajo queda en rojo y NO se despliega nada en Pages.
          git push || { echo "main se movió: se reintenta una vez sobre la versión actual"; git pull --rebase -q origin main && git push; }

      # 1.84: el sitio se ENSAMBLA con producción y pruebas en rutas separadas (/ y /calendario/ solo definitivos; /prueba/ solo pruebas).
      # Si algo no cuadra, el ensamblador falla y NO se despliega nada: Pages sigue sirviendo la última versión válida.
      - name: Preparar lo que se publica (producción en /, pruebas en /prueba/)
        if: steps.cambio.outputs.cambio == 'si' && hashFiles('estado/publicable/manifest.json') != ''
        run: python tools/ensamblar_sitio.py --repo . --destino _site

      - uses: actions/configure-pages@v5
        if: steps.cambio.outputs.cambio == 'si' && hashFiles('estado/publicable/manifest.json') != ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.cambio.outputs.cambio == 'si' && hashFiles('estado/publicable/manifest.json') != ''
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
        if: steps.cambio.outputs.cambio == 'si' && hashFiles('estado/publicable/manifest.json') != ''

      # Si el trabajo falló, el job queda en rojo y GitHub avisa por correo (el estado ya está guardado)
      - name: Marcar el fallo si lo hubo
        if: steps.trabajo.outcome == 'failure'
        run: |
          echo "::error::El trabajo terminó con rechazo o error: mira el paso «Hacer lo pedido». La última versión publicada se conserva."
          exit 1
